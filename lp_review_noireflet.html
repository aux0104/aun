<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ノ・アルフレ LP コンプライアンスレビュー</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: #e2e0d8;
    --border2: #ccc9bc;
    --text: #1a1916;
    --text2: #6b6860;
    --text3: #9e9c94;
    --r5-bg: #fce8e8; --r5-text: #7a1f1f; --r5-accent: #d94040;
    --r4-bg: #fdf0d8; --r4-text: #6b3d00; --r4-accent: #d97e10;
    --r3-bg: #e8f0fc; --r3-text: #1a3a6b; --r3-accent: #3a6fd8;
    --rna-bg: #ededea; --rna-text: #555; --rna-accent: #888;
    --green: #2a7a4b; --green-bg: #e6f5ed;
    --del-bg: #fce8e8; --del-text: #7a1f1f;
    --blue-bg: #e8f0fc; --blue-text: #1a3a6b; --blue-border: #3a6fd8;
    --radius: 8px; --radius-lg: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--text);
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .02em; }
  header .meta { font-size: 12px; color: #aaa; font-family: 'DM Mono', monospace; }

  /* ── Main layout ── */
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 24px 60px; }

  /* ── Stats bar ── */
  .stats {
    display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .stat {
    flex: 1; min-width: 80px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat .num { font-size: 26px; font-weight: 700; line-height: 1; font-family: 'DM Mono', monospace; }
  .stat .lbl { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .num-r5 { color: var(--r5-accent); }
  .num-r4 { color: var(--r4-accent); }
  .num-r3 { color: var(--r3-accent); }
  .num-na { color: var(--text3); }

  /* ── Toolbar ── */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    font-size: 12px; font-family: 'Noto Sans JP', sans-serif;
    padding: 6px 14px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
    font-weight: 400;
  }
  .filter-btn:hover { background: var(--surface2); color: var(--text); }
  .filter-btn.active { font-weight: 700; }
  .filter-btn[data-filter="all"].active { background: var(--text); color: #fff; border-color: var(--text); }
  .filter-btn[data-filter="5"].active { background: var(--r5-bg); color: var(--r5-text); border-color: var(--r5-accent); }
  .filter-btn[data-filter="4"].active { background: var(--r4-bg); color: var(--r4-text); border-color: var(--r4-accent); }
  .filter-btn[data-filter="3"].active { background: var(--r3-bg); color: var(--r3-text); border-color: var(--r3-accent); }

  .search-wrap { margin-left: auto; position: relative; }
  .search-wrap input {
    font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
    padding: 7px 14px 7px 34px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    width: 200px;
    outline: none;
    transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: var(--r3-accent); }
  .search-wrap::before {
    content: '🔍';
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    font-size: 13px; pointer-events: none;
  }

  /* ── Table ── */
  .table-wrap {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  col.c-no { width: 52px; }
  col.c-risk { width: 62px; }
  col.c-after { width: 200px; }
  col.c-comment { width: auto; }
  col.c-status { width: 88px; }

  th {
    background: var(--surface2);
    font-size: 11px; font-weight: 700;
    color: var(--text3);
    padding: 10px 14px;
    text-align: left;
    border-bottom: 0.5px solid var(--border);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  th:first-child { text-align: center; }

  td {
    padding: 11px 14px;
    border-bottom: 0.5px solid var(--border);
    vertical-align: top;
    font-size: 13px;
    word-break: break-all;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; transition: background .1s; }
  tbody tr:hover td { background: #faf9f5; }

  .td-no { text-align: center; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 13px; color: var(--text2); }
  .td-risk { text-align: center; }

  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 13px; font-weight: 700; font-family: 'DM Mono', monospace;
  }
  .b5 { background: var(--r5-bg); color: var(--r5-text); }
  .b4 { background: var(--r4-bg); color: var(--r4-text); }
  .b3 { background: var(--r3-bg); color: var(--r3-text); }
  .bna { background: var(--rna-bg); color: var(--rna-text); font-size: 10px; }

  .after-text { color: var(--r3-text); font-size: 12px; line-height: 1.5; }
  .del-pill {
    display: inline-block;
    background: var(--del-bg); color: var(--del-text);
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 4px; letter-spacing: .04em;
  }
  .na-dash { color: var(--text3); font-size: 12px; }
  .comment-preview { color: var(--text2); font-size: 12px; line-height: 1.5; }

  .status-select {
    font-size: 11px; font-family: 'Noto Sans JP', sans-serif;
    padding: 4px 6px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    width: 100%;
    cursor: pointer;
    outline: none;
  }
  tr.done td { opacity: .55; }
  tr.done .status-select { border-color: var(--green); color: var(--green); }

  .no-results { text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }

  /* ── Modal ── */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,18,14,.45);
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px 40px;
    overflow-y: auto;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border2);
    max-width: 620px; width: 100%;
    padding: 24px;
    position: relative;
    box-shadow: var(--shadow-md);
    animation: slideIn .18s ease;
  }
  @keyframes slideIn { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-close {
    position: absolute; top: 18px; right: 18px;
    background: var(--surface2); border: none;
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 16px; cursor: pointer; color: var(--text2);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .modal-close:hover { background: var(--border); }

  .modal-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px; padding-right: 36px;
  }
  .modal-header h2 { font-size: 15px; font-weight: 700; }

  .detail-block { margin-bottom: 14px; }
  .detail-label {
    font-size: 11px; font-weight: 700; color: var(--text3);
    letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .after-box {
    background: var(--blue-bg);
    border-left: 3px solid var(--blue-border);
    padding: 10px 14px;
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 13px; line-height: 1.7;
    color: var(--blue-text);
  }
  .comment-box {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    padding: 12px 14px;
    border-radius: var(--radius);
    font-size: 13px; line-height: 1.7;
    color: var(--text2);
  }
  .risk-desc {
    font-size: 12px; color: var(--text2);
    background: var(--surface2);
    border: 0.5px solid var(--border);
    padding: 6px 10px; border-radius: var(--radius);
    margin-top: 6px;
  }

  /* ── Progress bar ── */
  .progress-wrap { margin-bottom: 20px; }
  .progress-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .progress-track {
    height: 6px; background: var(--surface2);
    border-radius: 3px; overflow: hidden;
    border: 0.5px solid var(--border);
  }
  .progress-bar { height: 100%; background: var(--green); border-radius: 3px; transition: width .4s ease; }

  /* ── Footer ── */
  footer { text-align: center; font-size: 11px; color: var(--text3); padding: 20px; }

  @media (max-width: 680px) {
    col.c-after { width: 120px; }
    col.c-status { width: 72px; }
    header { padding: 16px 16px; }
    .container { padding: 16px; }
    .search-wrap input { width: 140px; }
  }
</style>
</head>

</div>

  {val:'wip',     label:'対応中'},
  {val:'done',    label:'対応済'},
  {val:'skip',    label:'見送り'},
];

const statusStore = {};
DATA.forEach(d => statusStore[d.no] = 'pending');

function badgeClass(r){ return r===5?'b5':r===4?'b4':r===3?'b3':'bna'; }
function badgeLabel(r){ return r||'?'; }

function updateStats(){
  const cnt={5:0,4:0,3:0,na:0};
  DATA.forEach(d=>{ if(d.risk===5)cnt[5]++; else if(d.risk===4)cnt[4]++; else if(d.risk===3)cnt[3]++; else cnt.na++; });
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat .num" style="font-size:26px;font-weight:700;font-family:'DM Mono',monospace;">${DATA.length}</div><div class="lbl">指摘総数</div></div>
    <div class="stat"><div class="num num-r5">${cnt[5]}</div><div class="lbl">リスク5</div></div>
    <div class="stat"><div class="num num-r4">${cnt[4]}</div><div class="lbl">リスク4</div></div>
    <div class="stat"><div class="num num-r3">${cnt[3]}</div><div class="lbl">リスク3</div></div>
    <div class="stat"><div class="num num-na">${cnt.na}</div><div class="lbl">要確認</div></div>
  `;
}

function updateProgress(){
  const done = Object.values(statusStore).filter(s=>s==='done'||s==='skip').length;
  const total = DATA.length;
  const pct = Math.round(done/total*100);
  document.getElementById('progress-text').textContent = `${done} / ${total} 完了`;
  document.getElementById('progress-bar').style.width = pct+'%';
}

function renderTable(filter, query){
  const tbody = document.getElementById('tbody');
  const q = query.toLowerCase();
  let rows = DATA.filter(d=>{
    if(filter==='5' && d.risk!==5) return false;
    if(filter==='4' && d.risk!==4) return false;
    if(filter==='3' && d.risk!==3) return false;
    if(filter==='na' && d.risk!==null) return false;
    if(q){
      return d.comment.toLowerCase().includes(q)
        || d.after.toLowerCase().includes(q)
        || String(d.no).includes(q);
    }
    return true;
  });

  if(!rows.length){
    tbody.innerHTML=`<tr><td colspan="5" class="no-results">該当する指摘事項がありません</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(d=>{
    const afterHtml = d.after==='削除'
      ? `<span class="del-pill">削除</span>`
      : d.after
        ? `<span class="after-text">${d.after.replace(/\n/g,'<br>')}</span>`
        : `<span class="na-dash">—</span>`;
    const preview = d.comment.length>55 ? d.comment.slice(0,53)+'…' : d.comment;
    const st = statusStore[d.no];
    const isDone = st==='done'||st==='skip';
    const selectHtml = STATUS_OPTIONS.map(o=>`<option value="${o.val}"${st===o.val?' selected':''}>${o.label}</option>`).join('');
    return `<tr data-no="${d.no}" class="${isDone?'done':''}">
      <td class="td-no">${d.no}</td>
      <td class="td-risk"><span class="badge ${badgeClass(d.risk)}">${badgeLabel(d.risk)}</span></td>
      <td>${afterHtml}</td>
      <td class="comment-preview">${preview}</td>
      <td><select class="status-select" data-no="${d.no}" onclick="event.stopPropagation()">${selectHtml}</select></td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('tr[data-no]').forEach(tr=>{
    tr.addEventListener('click', ()=>openModal(+tr.dataset.no));
  });
  tbody.querySelectorAll('.status-select').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const no = +e.target.dataset.no;
      statusStore[no] = e.target.value;
      const tr = e.target.closest('tr');
      const isDone = e.target.value==='done'||e.target.value==='skip';
      tr.classList.toggle('done', isDone);
      updateProgress();
    });
  });
}

function openModal(no){
  const d = DATA.find(x=>x.no===no);
  if(!d) return;
  const badge = document.getElementById('m-badge');
  badge.className = 'badge '+badgeClass(d.risk);
  badge.textContent = badgeLabel(d.risk);
  document.getElementById('m-title').textContent = `指摘 No.${d.no}`;

  const afterHtml = d.after==='削除'
    ? `<span class="del-pill" style="font-size:13px;padding:4px 10px">削除</span>`
    : d.after
      ? `<div class="after-box">${d.after.replace(/\n/g,'<br>')}</div>`
      : `<span class="na-dash">修正案なし（内容を要確認）</span>`;

  const riskSection = d.risk
    ? `<div class="risk-desc">リスク${d.risk}：${RISK_DESC[d.risk]||''}</div>`
    : `<div class="risk-desc">確認事項：事実確認が必要な項目です。</div>`;

  document.getElementById('m-body').innerHTML = `
    <div class="detail-block">
      <div class="detail-label">リスク評価</div>
      ${riskSection}
    </div>
    <div class="detail-block">
      <div class="detail-label">修正後テキスト</div>
      ${afterHtml}
    </div>
    <div class="detail-block">
      <div class="detail-label">指摘内容・理由</div>
      <div class="comment-box">${d.comment}</div>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click',()=>{
  document.getElementById('modal-bg').classList.remove('open');
});
document.getElementById('modal-bg').addEventListener('click',e=>{
  if(e.target===document.getElementById('modal-bg'))
    document.getElementById('modal-bg').classList.remove('open');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') document.getElementById('modal-bg').classList.remove('open');
});

let currentFilter='all', currentQuery='';
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTable(currentFilter, currentQuery);
  });
});
document.getElementById('search').addEventListener('input',e=>{
  currentQuery = e.target.value.trim();
  renderTable(currentFilter, currentQuery);
});

updateStats();
updateProgress();
renderTable('all','');
</script>
</body>
</html>
